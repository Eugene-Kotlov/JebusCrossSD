<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jebus Cross SD</title>
  <script>
    // Сброс кеша: версия меняется при каждом открытии страницы, поэтому
    // браузер всегда запрашивает style.css и скрипты заново.
    // Для обычного кеширования замените строку на фиксированную, например "1".
    window.ASSET_VERSION = String(Date.now());
    document.write(
      '<link rel="icon" href="img/64x64.jpg?v=' + window.ASSET_VERSION + '" type="image/jpeg">' +
      '<link rel="stylesheet" href="css/style.css?v=' + window.ASSET_VERSION + '">'
    );
  </script>
</head>
<body>
  <div id="app">
    <main id="board" class="board" aria-label="Поле драфта"></main>

    <aside class="sidebar">
      <div id="info" class="info">НЕТ<br>РАСКЛАДА</div>

      <section class="connect" aria-label="Подключение к комнате">
        <div class="connect-field">
          <label class="connect-label" for="net-name">Имя</label>
          <input id="net-name" type="text" maxlength="24" value="Игрок"
                 autocomplete="off" spellcheck="false">
        </div>
        <div class="connect-field">
          <label class="connect-label" for="net-room">Комната</label>
          <input id="net-room" type="password" maxlength="32" value="jebus"
                 autocomplete="off" spellcheck="false">
        </div>
        <div class="connect-row">
          <button id="btn-connect" class="btn btn-accent" type="button">Подключиться</button>
          <span id="net-status" class="net-status">не подключено</span>
        </div>
      </section>

      <div id="console" class="console" role="log" aria-live="polite"></div>

      <div class="chat-bar">
        <input id="chat-input" type="text" maxlength="500"
               placeholder="Сообщение в комнату" autocomplete="off" disabled>
        <button id="btn-send" class="btn" type="button" disabled>Отправить</button>
        <button id="btn-coin" class="btn" type="button" disabled>Бросить монетку</button>
      </div>

      <div class="actions">
        <button id="btn-done" class="btn btn-accent" type="button" disabled>Готово</button>
        <button id="btn-new" class="btn btn-accent" type="button">Новый расклад</button>
      </div>

      <button id="btn-template" class="btn template-btn" type="button" hidden>
        Скачать шаблон .h3t
      </button>
    </aside>
  </div>

  <div id="ghost-layer" class="ghost-layer" aria-hidden="true"></div>
  <div id="zoom-layer" class="zoom-layer" hidden aria-hidden="true"></div>

  <div id="draft-modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="draft-title">
      <h2 id="draft-title">НАСТРОЙКИ РАСКЛАДА</h2>
      <p class="muted">Карты в красной и синей зонах и общие карты посередине.</p>
      <div class="modal-row">
        <label for="ind-count">Индивидуальные карты</label>
        <input id="ind-count" type="number" min="0" max="9" step="1" value="9">
      </div>
      <div class="modal-row">
        <label for="shared-count">Общие карты</label>
        <input id="shared-count" type="number" min="0" max="3" step="1" value="3">
      </div>
      <p class="muted" id="draft-total"></p>
      <div class="modal-actions">
        <button id="draft-create" class="btn btn-accent" type="button">Создать</button>
        <button id="draft-cancel" class="btn" type="button">Отмена</button>
      </div>
    </div>
  </div>

  <noscript>
    <p style="color:#f3e2c0;padding:20px">Для работы нужен включённый JavaScript.</p>
  </noscript>

  <script>
    document.write(
      '<script src="js/mqtt.min.js?v=' + window.ASSET_VERSION + '"><\/script>' +
      '<script src="js/data.js?v=' + window.ASSET_VERSION + '"><\/script>' +
      '<script src="js/template.js?v=' + window.ASSET_VERSION + '"><\/script>' +
      '<script src="js/app.js?v=' + window.ASSET_VERSION + '"><\/script>'
    );
  </script>
</body>
</html>
